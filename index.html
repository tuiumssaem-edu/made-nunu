<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>다람쥐의 과자 나라 모험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  /* 레이아웃: 위는 동화책 그림처럼 그린 게임 무대(캔버스), 아래는 방향 버튼·공격·아이템 버튼이 있는 조작판 */
  :root {
    --paper: #fffaf2;
    --ink: #3a2a20;
    --choco: #4a2c1d;
    --choco-2: #6e3f28;
    --caramel: #e8a95c;
    --grape: #7a4cb8;
    --candy: #ff6f9f;
    --acorn: #c46a2b;
    --starlight: #6b5bd6;
    --mint: #3fae74;
    --gold: #f2b630;
    --hp-good: #52b043;
    --hp-mid: #f2b630;
    --hp-low: #e0453a;
    --font-ui: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color-scheme: light;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  button { font-family: inherit; color: inherit; touch-action: none; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--grape); outline-offset: 3px; }
  .sq { display: inline-block; transform: scaleX(-1); }

  #app { height: 100%; display: flex; flex-direction: column; }
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #9fd57f; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .hud-map {
    position: absolute; top: 10px;
    left: max(10px, env(safe-area-inset-left, 0px));
    right: max(10px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    pointer-events: none;
  }
  .hud-right { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .chip {
    pointer-events: auto;
    background: rgba(255, 250, 242, .95);
    border: 2px solid var(--choco);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 16px;
    box-shadow: 0 3px 0 var(--choco);
    font-variant-numeric: tabular-nums;
  }
  button.chip { cursor: pointer; }
  .badges { display: flex; align-items: center; gap: 3px; }
  .badges span { font-size: 19px; filter: grayscale(1); opacity: .3; }
  .badges span.got { filter: none; opacity: 1; }

  .hud-battle {
    position: absolute; top: 6px;
    left: max(12px, env(safe-area-inset-left, 0px));
    right: max(12px, env(safe-area-inset-right, 0px));
    display: grid; gap: 3px;
    pointer-events: none;
  }
  .vs-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; font-size: clamp(14px, 3.4vmin, 19px); }
  .vs-row .me { color: #2f7d2a; white-space: nowrap; }
  .vs-row .foe { text-align: right; color: var(--choco-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vs-row b { font-size: 1.3em; color: var(--grape); line-height: 1; }
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .bar { height: 16px; border: 2px solid var(--choco); background: #efe6d6; overflow: hidden; display: flex; }
  .bar.mine { border-radius: 10px 3px 3px 10px; }
  .bar.foe { border-radius: 3px 10px 10px 3px; justify-content: flex-end; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--hp-good); transition: width .25s, background-color .25s; }
  .gym-line { text-align: center; font-size: 13px; color: var(--choco-2); font-variant-numeric: tabular-nums; }

  .controls {
    flex: none;
    display: flex; align-items: center; gap: 14px;
    background: var(--choco);
    border-top: 4px solid var(--caramel);
    padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    color: var(--paper);
  }
  .dpad { --b: clamp(46px, 10vmin, 62px); display: grid; grid-template-columns: repeat(3, var(--b)); grid-template-rows: repeat(3, var(--b)); gap: 4px; flex: none; }
  .dpad button { border: 0; border-radius: 14px; background: var(--caramel); box-shadow: inset 0 -5px 0 rgba(0,0,0,.22); font-size: calc(var(--b) * .42); cursor: pointer; }
  .dpad button.on { background: #f6c27f; transform: translateY(2px); box-shadow: none; }
  .dpad [data-dir="up"] { grid-area: 1 / 2; } .dpad [data-dir="left"] { grid-area: 2 / 1; }
  .dpad [data-dir="right"] { grid-area: 2 / 3; } .dpad [data-dir="down"] { grid-area: 3 / 2; }
  .dpad .hub { grid-area: 2 / 2; display: grid; place-items: center; font-size: calc(var(--b) * .45); }

  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .hint { font-size: clamp(14px, 3vmin, 19px); line-height: 1.4; color: #f6e6d2; }
  .hint b { color: #ffd84a; font-weight: normal; }
  .attacks, .items { display: flex; flex-wrap: wrap; gap: 8px; }
  .atk { position: relative; overflow: hidden; flex: 1 1 140px; min-height: 56px; border: 0; border-radius: 16px; font-size: clamp(16px, 3.4vmin, 21px); cursor: pointer; box-shadow: inset 0 -5px 0 rgba(0,0,0,.28); padding: 6px 10px; color: #fff; }
  .atk.acorn { background: var(--acorn); } .atk.starlight { background: var(--starlight); }
  .atk:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
  .atk::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: calc(var(--cd, 0) * 100%); background: rgba(0,0,0,.45); pointer-events: none; }
  .atk:disabled { cursor: default; }
  .key { display: none; margin-left: 6px; font-size: .7em; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.28); vertical-align: middle; }
  .atk .cd { display: block; font-size: .62em; opacity: .9; }
  .itm { flex: 1 1 110px; min-height: 42px; border: 2px solid var(--caramel); border-radius: 14px; background: #5c3826; font-size: clamp(14px, 3vmin, 17px); cursor: pointer; padding: 4px 8px; color: #fff3e0; font-variant-numeric: tabular-nums; }
  .itm:disabled { opacity: .45; cursor: default; }
  .itm:active:not(:disabled) { transform: translateY(2px); }
  @media (hover: hover) and (pointer: fine) { .key { display: inline-block; } }
  @media (max-width: 480px) { .atk .cd { display: none; } .atk { min-height: 48px; } }

  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center;
    background: rgba(58, 42, 32, .5);
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-y: auto;
  }
  .card {
    width: min(100%, 440px);
    background: var(--paper);
    border: 3px solid var(--choco);
    border-radius: 24px;
    box-shadow: 0 6px 0 var(--choco), 0 18px 40px rgba(0,0,0,.25);
    padding: 20px 18px 18px;
    text-align: center;
  }
  .card .big { font-size: 56px; line-height: 1; }
  .card h2 { margin: 8px 0 6px; font-weight: normal; font-size: 27px; line-height: 1.2; color: var(--grape); text-wrap: balance; }
  .card p { margin: 0 0 6px; font-size: 17px; line-height: 1.5; }
  .card ul { text-align: left; margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 16px; line-height: 1.4; }
  .reward { display: inline-block; margin-top: 6px; padding: 4px 14px; border-radius: 999px; background: #fff1c7; border: 2px solid var(--gold); font-size: 18px; }
  .lineup { display: flex; justify-content: center; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; }
  .lineup div { flex: 1 1 0; min-width: 84px; border: 2px dashed var(--choco-2); border-radius: 14px; padding: 8px 4px; font-size: 14px; }
  .lineup div span { display: block; font-size: 34px; line-height: 1.1; }
  .btns { display: grid; gap: 8px; margin-top: 16px; }
  .btns button { min-height: 52px; border-radius: 16px; font-size: 20px; cursor: pointer; border: 3px solid var(--choco); }
  .btns .primary { background: var(--candy); color: #fff; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); }
  .btns .secondary { background: var(--paper); color: var(--ink); font-size: 17px; min-height: 44px; }

  .wallet { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 999px; background: #fff1c7; border: 2px solid var(--gold); font-size: 19px; font-variant-numeric: tabular-nums; }
  .shop-msg { min-height: 22px; margin: 6px 0 2px; font-size: 15px; color: var(--mint); }
  .shop-sec { text-align: left; margin: 12px 0 6px; font-size: 15px; color: var(--choco-2); }
  .shop-list { display: grid; gap: 8px; text-align: left; }
  .shop-row { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 16px; background: #fff; border: 2px solid #ecdcc4; }
  .shop-row > div { min-width: 0; }
  .shop-row .ic { font-size: 32px; text-align: center; }
  .shop-row .nm { font-size: 17px; }
  .shop-row .ds { font-size: 13px; color: #7a6352; line-height: 1.35; }
  .shop-row .lv { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
  .shop-row .lv i { width: 8px; height: 8px; border-radius: 50%; background: #e4d6c2; }
  .shop-row .lv i.on { background: var(--gold); }
  .buy { min-width: 76px; min-height: 42px; border-radius: 12px; border: 2px solid var(--choco); background: var(--gold); font-size: 16px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .buy:disabled { background: #eee3d3; color: #9a8877; border-color: #cdbba5; cursor: default; }
</style>

<div id="app">
  <div class="stage" id="stage">
    <canvas id="view" aria-label="다람쥐의 과자 나라 게임 화면"></canvas>

    <div class="hud-map" id="hud-map">
      <button class="chip" id="help-btn" type="button">❓ 게임 방법</button>
      <div class="hud-right">
        <div class="chip" id="coin-chip">🪙 0</div>
        <div class="chip badges" id="badges"><span data-id="fire">🔥</span><span data-id="water">💧</span><span data-id="bolt">⚡</span><span data-id="king">👑</span></div>
      </div>
    </div>

    <div class="hud-battle" id="hud-battle" hidden>
      <div class="vs-row"><span class="me"><span class="sq">🐿️</span> 다람쥐</span><b>VS</b><span class="foe" id="mon-label">몬스터</span></div>
      <div class="bars"><div class="bar mine"><i id="php"></i></div><div class="bar foe"><i id="mhp"></i></div></div>
      <div class="gym-line" id="gym-line"></div>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" aria-label="방향 버튼">
      <button type="button" data-dir="up" aria-label="위로">⬆️</button>
      <button type="button" data-dir="left" aria-label="왼쪽으로">⬅️</button>
      <div class="hub"><span class="sq">🐿️</span></div>
      <button type="button" data-dir="right" aria-label="오른쪽으로">➡️</button>
      <button type="button" data-dir="down" aria-label="아래로">⬇️</button>
    </div>
    <div class="side">
      <div class="hint" id="hint-map">방향 버튼을 누르거나 <b>화면을 꾹 누르면</b> 다람쥐가 걸어가요. 분수 뒤 <b>상점</b>과 길 끝 <b>체육관</b>에 들어가 보세요!</div>
      <div class="attacks" id="attacks" hidden>
        <button type="button" class="atk acorn" id="atk-acorn"><span id="acorn-name">🌰 도토리 미사일</span><span class="key">Z</span><span class="cd" id="acorn-cd"></span></button>
        <button type="button" class="atk starlight" id="atk-star"><span id="star-name">✨ 별빛 스매시</span><span class="key">X</span><span class="cd" id="star-cd"></span></button>
      </div>
      <div class="items" id="items" hidden>
        <button type="button" class="itm" id="use-cookie"><span>🍪 쿠키 ×0</span><span class="key">C</span></button>
        <button type="button" class="itm" id="use-cake"><span>🍰 케이크 ×0</span><span class="key">V</span></button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card">
    <div class="big" id="ov-emoji"></div>
    <h2 id="ov-title"></h2>
    <div id="ov-body"></div>
    <div class="btns" id="ov-btns"></div>
  </div>
</div>

<script>
(() => {
  // =========================================================
  // 0. 기본 준비
  // =========================================================
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const canvas = $('view');
  const ctx = canvas.getContext('2d');
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  let W = 300, H = 300, dpr = 1;

  // =========================================================
  // 1. 마을 지도 (아이 그림 1·2번 배치)
  //    아래 입구 → 롤리팝 기둥과 환영 가랜드 → 길 → 광장 초콜릿 분수 → 분수 뒤 상점
  //    광장과 큰길에서 갈라지는 길 끝마다 체육관
  // =========================================================
  const WORLD = { w: 1200, h: 2600 };
  const GYMS = [
    { id: 'fire',  name: '불꽃 체육관',   icon: '🔥', badge: '🔥', roof: '#ec6a4c', rect: [60, 550, 300, 260], pattern: 'aim',
      monsters: [{ e: '🦎', n: '불꽃 도마뱀' }, { e: '🐗', n: '활활 멧돼지' }, { e: '🐉', n: '화염 드래곤' }] },
    { id: 'water', name: '물방울 체육관', icon: '💧', badge: '💧', roof: '#4aa3e0', rect: [840, 550, 300, 260], pattern: 'spread',
      monsters: [{ e: '🐸', n: '퐁당 개구리' }, { e: '🦀', n: '집게 꽃게' }, { e: '🐙', n: '대왕 문어' }] },
    { id: 'bolt',  name: '번개 체육관',   icon: '⚡', badge: '⚡', roof: '#f0bf2e', rect: [60, 1270, 300, 260], pattern: 'fast',
      monsters: [{ e: '🐝', n: '찌릿 벌' }, { e: '👾', n: '번쩍 외계인' }, { e: '🤖', n: '전기 로봇' }] },
    { id: 'king',  name: '과자왕 체육관', icon: '🍬', badge: '👑', roof: '#d85aa8', rect: [840, 1270, 300, 260], pattern: 'mix', final: true,
      monsters: [{ e: '👻', n: '사탕 유령' }, { e: '👹', n: '과자 도깨비' }, { e: '🦖', n: '초코 공룡왕' }] },
  ];
  const SHOP = { id: 'shop', rect: [450, 80, 300, 220] };
  const door = (b) => ({ x: b.rect[0] + b.rect[2] / 2, y: b.rect[1] + b.rect[3] });
  const ROADS = [
    [[600, 2700], [600, 290]],
    [[430, 935], [210, 935], [210, 800]],
    [[770, 935], [990, 935], [990, 800]],
    [[600, 1670], [210, 1670], [210, 1520]],
    [[600, 1670], [990, 1670], [990, 1520]],
  ];
  const PLAZA = { x: 600, y: 840, r: 235 };
  const FOUNTAIN_BLOCK = [455, 665, 290, 250];
  const START = { x: 600, y: 2440 };

  // =========================================================
  // 2. 저장되는 정보 (배지 · 금화 · 아이템 · 업그레이드) — 이 기기에만 저장돼요
  // =========================================================
  const SAVE_KEY = 'squirrel-candy-save-v2';
  const fresh = () => ({ badges: { fire: false, water: false, bolt: false, king: false }, coins: 0, cookie: 0, cake: 0, lv: { acorn: 0, star: 0, armor: 0, shoes: 0 } });
  let save = fresh();
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s) { save = Object.assign(fresh(), s); save.badges = Object.assign(fresh().badges, s.badges); save.lv = Object.assign(fresh().lv, s.lv); }
    else { const old = JSON.parse(localStorage.getItem('squirrel-candy-badges-v1') || 'null'); if (old) save.badges = Object.assign(save.badges, old); }
  } catch (_) {}
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {} };
  const kingOpen = () => save.badges.fire && save.badges.water && save.badges.bolt;

  const ITEMS = {
    cookie: { emoji: '🍪', name: '초코 쿠키',   heal: 30, price: 15, max: 9 },
    cake:   { emoji: '🍰', name: '딸기 케이크', heal: 70, price: 35, max: 5 },
  };
  const UPGRADES = {
    acorn: { emoji: '🌰', name: '도토리 미사일', desc: '공격력이 4씩 세져요', costs: [30, 50, 80, 120] },
    star:  { emoji: '✨', name: '별빛 스매시',   desc: '공격력 +7, 다시 쓰는 시간이 0.15초씩 짧아져요', costs: [40, 70, 110, 160] },
    armor: { emoji: '🛡️', name: '튼튼 도토리 갑옷', desc: '최대 체력이 20씩 늘어나요', costs: [50, 90, 140] },
    shoes: { emoji: '👟', name: '날쌘 운동화',   desc: '공격을 피할 때 더 빨리 움직여요', costs: [40, 80] },
  };
  const stats = () => ({
    acornDmg: 9 + save.lv.acorn * 4, acornCd: 800,
    starDmg: 20 + save.lv.star * 7, starCd: 2000 - save.lv.star * 150,
    maxHp: 100 + save.lv.armor * 20,
    speed: 1 + save.lv.shoes * .15,
  });

  // =========================================================
  // 3. 그림 도구
  // =========================================================
  function rng(seed) { let s = (seed >>> 0) || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
  let SC = 1;
  function rrect(x, y, w, h, r) {
    const p = new Path2D(); r = Math.min(r, w / 2, h / 2);
    p.moveTo(x + r, y); p.arcTo(x + w, y, x + w, y + h, r); p.arcTo(x + w, y + h, x, y + h, r);
    p.arcTo(x, y + h, x, y, r); p.arcTo(x, y, x + w, y, r); p.closePath(); return p;
  }
  function poly(pts) { const p = new Path2D(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath(); return p; }
  function circle(x, y, r) { const p = new Path2D(); p.arc(x, y, r, 0, Math.PI * 2); return p; }
  function withShadow(g, blur, oy, color, fn) {
    g.save(); g.shadowColor = color || 'rgba(70, 45, 20, .28)'; g.shadowBlur = blur * SC; g.shadowOffsetY = oy * SC; fn(); g.restore();
  }
  function lin(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
  function rad(g, x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
  function label(g, text, x, y, size, color, align = 'center') {
    g.font = `${size}px Jua, "Apple SD Gothic Neo", sans-serif`; g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = color; g.fillText(text, x, y);
  }
  function emoji(g, ch, x, y, size, flip = false) {
    g.save(); g.translate(x, y); if (flip) g.scale(-1, 1);
    g.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000'; g.fillText(ch, 0, 0);
    g.restore();
  }

  // =========================================================

  let courtBg = null, courtKey = '';

  function renderCourt(C) {
    const c = document.createElement('canvas'); c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    const g = c.getContext('2d'); g.scale(dpr, dpr); SC = dpr;

    else for (let xx = C.x + 26; xx < C.x + C.w; xx += 26) { g.beginPath(); g.moveTo(xx, C.y); g.lineTo(xx, C.y + C.h); g.stroke(); }
    g.fillStyle = rad(g, C.x + C.w / 2, C.y + C.h * .3, 10, Math.max(C.w, C.h) * .7, [[0, 'rgba(255,255,255,.14)'], [1, 'rgba(255,255,255,0)']]); g.fillRect(C.x, C.y, C.w, C.h);
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 3; g.stroke(rrect(C.x + 10, C.y + 10, C.w - 20, C.h - 20, 12));
    g.beginPath();
    if (C.horiz) { g.moveTo(C.x + C.w / 2, C.y + 10); g.lineTo(C.x + C.w / 2, C.y + C.h - 10); }
    else { g.moveTo(C.x + 10, C.y + C.h / 2); g.lineTo(C.x + C.w - 10, C.y + C.h / 2); }

    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 3; g.stroke(circle(cx, cy, m * .14));

    floorFlame(g, ...at(.3, .78), m * .075); floorFlame(g, ...at(.72, .76), m * .075);

    const n = Math.max(4, Math.floor(C.w / 58));

  function floorDrop(g, x, y, s, flip) {

  }

  const held = { up: false, down: false, left: false, right: false };
  const keyDir = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  const keysDown = new Set(); const padDown = new Map();
  const ptr = { id: null, x: 0, y: 0 };
  function refreshHeld() {
    for (const k in held) held[k] = false;
    keysDown.forEach((c) => { held[keyDir[c]] = true; });
    padDown.forEach((d) => { held[d] = true; });
    document.querySelectorAll('.dpad button').forEach((b) => b.classList.toggle('on', held[b.dataset.dir]));
  }
  function clearInput() { keysDown.clear(); padDown.clear(); ptr.id = null; refreshHeld(); }

  document.addEventListener('keydown', (e) => {
    if (keyDir[e.code]) { e.preventDefault(); keysDown.add(e.code); refreshHeld(); return; }
    if (playing && screen === 'battle' && !e.repeat) {
      if (e.code === 'KeyZ' || e.code === 'Digit1') useSkill('acorn');
      if (e.code === 'KeyX' || e.code === 'Digit2') useSkill('star');
      if (e.code === 'KeyC') useItem('cookie');
      if (e.code === 'KeyV') useItem('cake');
    }
  });
  document.addEventListener('keyup', (e) => { if (keyDir[e.code]) { keysDown.delete(e.code); refreshHeld(); } });
  window.addEventListener('blur', clearInput);

  document.querySelectorAll('.dpad button').forEach((btn) => {
    const release = (e) => { padDown.delete(e.pointerId); refreshHeld(); };
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      padDown.set(e.pointerId, btn.dataset.dir); refreshHeld();
    });
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('lostpointercapture', release);
  });
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  const setPtr = (e) => { const rc = canvas.getBoundingClientRect(); ptr.x = e.clientX - rc.left; ptr.y = e.clientY - rc.top; };
  canvas.addEventListener('pointerdown', (e) => {

  });

  let screen = 'map';

  function updateCamera() {

  function updateMap(dt) {

    $('hint-map').hidden = true; $('attacks').hidden = false; $('items').hidden = false;
    $('acorn-name').textContent = `🌰 도토리 미사일${save.lv.acorn ? ' Lv' + (save.lv.acorn + 1) : ''}`;
    $('star-name').textContent = `✨ 별빛 스매시${save.lv.star ? ' Lv' + (save.lv.star + 1) : ''}`;
    $('acorn-cd').textContent = `${st.acornCd / 1000}초마다 쓸 수 있어요`;
    $('star-cd').textContent = `${st.starCd / 1000}초마다 쓸 수 있어요`;
    courtKey = '';
    startMonster(true);
  }

  function startMonster(first) {
    const gym = GYMS[B.gi], m = gym.monsters[B.mi];
    B.mhpMax = 70 + B.mi * 25 + B.gi * 20; B.mhp = B.mhpMax;
    B.projs = []; B.shots = []; B.mon++;
    skills.acorn.readyAt = skills.star.readyAt = 0;
    updateHud();
    const go = () => { B.nextSpawn = performance.now() + 700; B.invUntil = 0; resume(); };
    if (first) {
      showCard({ emoji: m.e, title: `앗! ${josa(m.n, '이', '가')} 나타났다!`,
        html: `<p>${gym.name} · 몬스터 1/3</p><p>날아오는 공격을 피하면서<br>🌰 ✨ 버튼으로 공격하세요!</p>`,
        buttons: [{ label: '싸우기!', onClick: go }] });
    } else go();
  }

  function updateHud() {
    const gym = GYMS[B.gi], m = gym.monsters[B.mi], max = stats().maxHp;
    $('mon-label').textContent = `${m.n} ${m.e}`;
    $('gym-line').textContent = `${gym.name} · 몬스터 ${B.mi + 1}/3 · 내 체력 ${Math.max(0, B.php)}/${max}`;
    const color = (v) => v > 50 ? 'var(--hp-good)' : v > 25 ? 'var(--hp-mid)' : 'var(--hp-low)';
    const mp = Math.max(0, B.mhp) / B.mhpMax * 100, pp = Math.max(0, B.php) / max * 100;
    $('php').style.width = pp + '%'; $('php').style.background = color(pp);
    $('mhp').style.width = mp + '%'; $('mhp').style.background = color(mp);
    refreshItems();
  }
  function refreshItems() {
    const full = !B || B.php >= stats().maxHp;
    $('use-cookie').firstElementChild.textContent = `🍪 쿠키 ×${save.cookie}`;
    $('use-cake').firstElementChild.textContent = `🍰 케이크 ×${save.cake}`;
    $('use-cookie').disabled = !save.cookie || full;
    $('use-cake').disabled = !save.cake || full;
  }

  function sizes(C) {
    const m = Math.min(C.w, C.h);
    return { sq: clamp(m * .14, 38, 66), ms: clamp(m * .24, 60, 130), ps: clamp(m * .085, 26, 44), L: Math.max(C.w, C.h) };
  }
  function sqPos(C) { return { x: C.x + C.w * B.fx, y: C.y + C.h * B.fy }; }
  function monPos(C) {
    const wob = Math.sin(B.t * .9) * .3;
    return C.horiz ? { x: C.x + C.w * .8, y: C.y + C.h * (.5 + wob) } : { x: C.x + C.w * (.5 + wob), y: C.y + C.h * .2 };
  }
  function clampSquirrel(C) {
    if (C.horiz) { B.fx = clamp(B.fx, .06, .44); B.fy = clamp(B.fy, .1, .9); }
    else { B.fx = clamp(B.fx, .08, .92); B.fy = clamp(B.fy, .58, .92); }
  }

  function useSkill(name) {
    if (!playing || screen !== 'battle' || !B) return;
    const sk = skills[name], now = performance.now(), st = stats();
    if (now < sk.readyAt) return;
    sk.readyAt = now + (name === 'acorn' ? st.acornCd : st.starCd);
    const C = courtGeom(), S = sqPos(C);
    const base = name === 'acorn' ? st.acornDmg : st.starDmg;
    B.shots.push({ emoji: sk.emoji, x0: S.x, y0: S.y, t0: now, dur: sk.travel, dmg: base + Math.floor(Math.random() * sk.spread), mon: B.mon, big: name === 'star' });
  }

  function useItem(kind) {
    if (!playing || screen !== 'battle' || !B) return;
    const it = ITEMS[kind], max = stats().maxHp;
    if (save[kind] <= 0 || B.php >= max) return;
    save[kind]--; persist();
    const before = B.php; B.php = Math.min(max, B.php + it.heal);
    const S = sqPos(courtGeom());
    addFloat(`${it.emoji}+${B.php - before}`, S.x, S.y - 34, '#7be08a');
    updateHud();
  }

  function monsterAttack(C, now) {
    const gym = GYMS[B.gi];
    let pat = gym.pattern;
    if (pat === 'mix') pat = ['aim', 'spread', 'fast'][Math.floor(Math.random() * 3)];
    const M = monPos(C), S = sqPos(C), { L } = sizes(C);
    const ang = Math.atan2(S.y - M.y, S.x - M.x);
    const speed = { aim: L / 2.1, spread: L / 2.8, fast: L / 1.35 }[pat];
    const offs = pat === 'spread' ? [-.32, 0, .32] : [(Math.random() - .5) * .15];
    offs.forEach((o) => B.projs.push({ x: M.x, y: M.y, vx: Math.cos(ang + o) * speed, vy: Math.sin(ang + o) * speed, e: SHOT_EMOJI[pat] }));
    const base = Math.max(480, 1250 - B.mi * 170 - B.gi * 90);
    B.nextSpawn = now + base + (pat === 'spread' ? 250 : 0);
  }

  function addFloat(text, x, y, color) { B.floats.push({ text, x, y, t0: performance.now(), color }); }

  function updateBattle(dt, now) {
    const C = courtGeom();
    if (B.horiz !== C.horiz) {
      B.horiz = C.horiz; B.projs = [];
      if (C.horiz) { B.fx = .18; B.fy = .5; } else { B.fx = .5; B.fy = .8; }
    }
    B.t += dt;
    const S0 = sqPos(C), { sq, ps, L } = sizes(C);
    const [mx, my, mag] = moveVec(S0.x, S0.y);
    const sp = L * .55 * stats().speed * mag * dt;
    B.fx += mx * sp / C.w; B.fy += my * sp / C.h; clampSquirrel(C);
    if (now >= B.nextSpawn) monsterAttack(C, now);

    const S = sqPos(C);
    B.projs = B.projs.filter((p) => {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < C.x - 40 || p.x > C.x + C.w + 40 || p.y < C.y - 40 || p.y > C.y + C.h + 40) return false;
      if (now >= B.invUntil && Math.hypot(p.x - S.x, p.y - S.y) < sq * .36 + ps * .3) { hurt(now, S); return false; }
      return true;
    });

    const M = monPos(C);
    B.shots = B.shots.filter((s) => {
      if (s.mon !== B.mon) return false;
      if ((now - s.t0) / s.dur >= 1) {
        if (!playing) return false;
        B.mhp = Math.max(0, B.mhp - s.dmg); B.hitAt = now; B.cheerAt = now;
        addFloat('-' + s.dmg, M.x + (Math.random() - .5) * 30, M.y - 30, '#ffd84a');
        updateHud();
        if (B.mhp <= 0) monsterDown(M);
        return false;
      }
      return true;
    });
  }

  function hurt(now, S) {
    if (!playing) return;
    B.php -= 10; B.invUntil = now + 800;
    addFloat('-10', S.x, S.y - 30, '#ff6b6b');
    updateHud();
    if (B.php <= 0) lose();
  }

  function backToMap() {
    const gym = GYMS[B.gi];
    screen = 'map'; B = null;
    $('hud-map').hidden = false; $('hud-battle').hidden = true;
    $('hint-map').hidden = false; $('attacks').hidden = true; $('items').hidden = true;
    refreshHud(); stepBack(gym); resume();
  }

  function monsterDown(M) {
    if (!playing) return;
    playing = false;
    const gym = GYMS[B.gi], m = gym.monsters[B.mi];
    const reward = 10 + B.gi * 5 + B.mi * 5;
    save.coins += reward; B.earned += reward; persist();
    addFloat(`🪙+${reward}`, M.x, M.y - 10, '#ffd84a');
    B.projs = [];
    setTimeout(() => {
      if (B.mi < 2) {
        const next = gym.monsters[B.mi + 1];
        showCard({ emoji: '🎉', title: `${josa(m.n, '을', '를')} 물리쳤어요!`,
          html: `<div class="reward">🪙 금화 ${reward}개를 받았어요!</div><p style="margin-top:10px">남은 체력 ${B.php}/${stats().maxHp}<br>다음 상대는 ${next.e} <b>${next.n}</b>!</p><p>체력이 부족하면 싸우는 중에 🍪 🍰 을 먹어요.</p>`,
          buttons: [{ label: '다음 몬스터!', onClick: () => { B.mi++; startMonster(false); } }] });
      } else {
        const firstTime = !save.badges[gym.id];
        const bonus = firstTime ? 50 : 20;
        save.badges[gym.id] = true; save.coins += bonus; B.earned += bonus; persist(); mapBg = null;
        let html = `<p>${gym.name}의 몬스터를 모두 물리쳤어요!</p><div class="reward">🪙 이번 도전에서 금화 ${B.earned}개</div><p style="margin-top:8px">(체육관 보너스 ${bonus}개 포함)</p>`;
        if (gym.final) html += '<p>🏆 <b>과자 나라 챔피언</b>이 되었어요!</p>';
        else if (firstTime && kingOpen()) html += '<p>🔓 배지를 다 모아서 <b>과자왕 체육관</b> 문이 열렸어요!</p>';
        else html += '<p>상점에서 기술을 업그레이드해 보세요!</p>';
        showCard({ emoji: gym.badge, title: firstTime ? `${gym.badge} 배지를 얻었어요!` : '다시 한 번 승리!', html, buttons: [{ label: '마을로 돌아가기', onClick: backToMap }] });
      }
    }, 600);
  }

  function lose() {
    if (!playing) return;
    playing = false;
    const gym = GYMS[B.gi];
    B.projs = [];
    setTimeout(() => {
      const earned = B.earned ? `<div class="reward">🪙 그래도 금화 ${B.earned}개는 받았어요</div>` : '';
      showCard({ emoji: '😭', title: '앗, 체력이 다 떨어졌어요…',
        html: `${earned}<p style="margin-top:8px">상점에서 회복 과자를 사거나 기술을 강화하고<br>${gym.name}에 다시 도전해 봐요!</p>`,
        buttons: [{ label: '마을로 돌아가기', onClick: backToMap }] });
    }, 500);
  }

  function drawBattle(now) {
    const C = courtGeom();
    const key = `${W}x${H}x${dpr}x${C.horiz}x${C.y}`;
    if (key !== courtKey) { courtKey = key; courtBg = renderCourt(C); }
    if (B.horiz === null) { B.horiz = C.horiz; if (!C.horiz) { B.fx = .5; B.fy = .8; } }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.drawImage(courtBg, 0, 0, W, H);
    const { sq, ms, ps } = sizes(C);

    const n = Math.max(4, Math.floor(C.w / 58)); const cheer = now - B.cheerAt < 600;
    const asz = clamp(C.benchH * .5, 22, 34);
    for (let i = 0; i < n; i++) {
      const x = C.x + (i + .5) * C.w / n;
      const bob = Math.abs(Math.sin(now / (cheer ? 90 : 420) + i)) * (cheer ? 8 : 3);
      emoji(ctx, AUDIENCE[i % AUDIENCE.length], x, C.benchY + C.benchH * .38 - bob, asz);
    }

    const M = monPos(C), m = GYMS[B.gi].monsters[B.mi];
    const hit = now - B.hitAt < 200;
    ctx.beginPath(); ctx.ellipse(M.x, M.y + ms * .45, ms * .35, ms * .1, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,30,.25)'; ctx.fill();
    ctx.save(); ctx.translate(M.x + (hit ? (Math.random() - .5) * 10 : 0), M.y + Math.sin(B.t * 3) * ms * .04);
    if (hit) { ctx.rotate(.2); ctx.scale(.88, .88); ctx.beginPath(); ctx.arc(0, 0, ms * .55, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill(); }
    if (B.mhp > 0 || hit) emoji(ctx, m.e, 0, 0, ms);
    ctx.restore();

    const S = sqPos(C);
    ctx.beginPath(); ctx.ellipse(S.x, S.y + sq * .45, sq * .35, sq * .1, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,30,.25)'; ctx.fill();
    ctx.save(); if (now < B.invUntil && Math.floor(now / 100) % 2) ctx.globalAlpha = .3;
    emoji(ctx, '🐿️', S.x, S.y, sq, true); ctx.restore();

    B.projs.forEach((p) => emoji(ctx, p.e, p.x, p.y, ps));

    B.shots.forEach((s) => {
      const t = clamp((now - s.t0) / s.dur, 0, 1);
      const x = s.x0 + (M.x - s.x0) * t, y = s.y0 + (M.y - s.y0) * t;
      const lift = Math.sin(t * Math.PI) * 40;
      ctx.save(); ctx.translate(x + (C.horiz ? 0 : lift), y + (C.horiz ? -lift : 0)); ctx.rotate(t * 8);
      emoji(ctx, s.emoji, 0, 0, s.big ? ps * 1.4 : ps); ctx.restore();
    });

    B.floats = B.floats.filter((f) => {
      const t = (now - f.t0) / 900; if (t >= 1) return false;
      ctx.save(); ctx.globalAlpha = 1 - t;
      ctx.font = `${clamp(ps, 22, 34)}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = '#3a2a20'; ctx.strokeText(f.text, f.x, f.y - t * 50);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y - t * 50);
      ctx.restore(); return true;
    });
  }

  function skillUi(now) {
    if (screen !== 'battle') return;
    const st = stats();
    [['acorn', st.acornCd], ['star', st.starCd]].forEach(([k, cd]) => {
      const sk = skills[k];
      const ratio = playing ? Math.max(0, sk.readyAt - now) / cd : 0;
      sk.el.style.setProperty('--cd', ratio.toFixed(3));
      sk.el.disabled = ratio > 0;
    });
  }

  // =========================================================
  // 11. 화면 크기 맞추기 + 게임 루프
  // =========================================================
  function resize() {
    W = Math.max(1, stage.clientWidth); H = Math.max(1, stage.clientHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    mapScale = clamp(Math.min(W / 620, H / 820), .5, 1.3);
    if (B) B.projs = [];
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (playing) { if (screen === 'map') updateMap(dt); else if (B) updateBattle(dt, now); }
    if (screen === 'map') drawMap(now); else if (B) drawBattle(now);
    skillUi(now);
    requestAnimationFrame(loop);
  }

  const fontsReady = Promise.race([
    document.fonts.load('20px Jua').catch(() => {}),
    new Promise((res) => setTimeout(res, 2500)),
  ]);
  refreshHud();
  fontsReady.then(() => {
    mapBg = null; courtKey = '';
    requestAnimationFrame(loop);
    showCard({ emoji: '🐿️', title: '다람쥐의 과자 나라 모험', html: howToHtml, buttons: [{ label: '시작하기', onClick: resume }] });
  });
})();
</script>

</body></html>
